---
name: Security Scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/security-scans.yml@4f77b1856421438fefe16f69ed4dd682a445f7b1 # v1
    with:
      checkov-frameworks: github_actions,dockerfile
      trivy-scanners: vuln,secret,misconfig
