---
name: Security Scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/security-scans.yml@88e2614117b0d11fd7f2e0bd81de3975eff17394 # v1
    with:
      checkov-frameworks: github_actions,dockerfile
      trivy-scanners: vuln,secret,misconfig
